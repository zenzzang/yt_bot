name: YouTube to Teams Bot

on:
  schedule:
    - cron: '*/10 * * * *'  # 10분마다 실행
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # 깃허브 저장소에 변경된 seen_videos.json을 다시 커밋하기 위한 권한 부여
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Run script
        run: |
          python main.py

      - name: Save seen videos back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_videos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen videos [skip ci]" && git push)
