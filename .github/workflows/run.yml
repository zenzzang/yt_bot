name: YouTube to Teams Bot

on:
  schedule:
    - cron: '*/10 * * * *'  # 10분마다 실행
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Wait for exact timing (30 seconds offset)
        run: sleep 30  # 실행 직후 30초를 대기했다가 파이썬을 돌려 정각/10분 단위의 30초 오프셋을 맞춤

      - name: Run script
        run: |
          python main.py
