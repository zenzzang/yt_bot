name: YouTube to Teams Bot

on:
  schedule:
    - cron: '1,11,21,31,41,51 * * * *'  # 1분, 11분, 21분, 31분, 41분, 51분마다 실행
  workflow_dispatch:      # 수동 실행 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests

      - name: Run script
        run: |
          python main.py

      - name: Save seen videos back to repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_videos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen videos [skip ci]" && git push)

